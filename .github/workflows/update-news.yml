name: update-news
# 每 30 分钟自动抓取官方新闻源并更新站点数据
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取新闻
        run: node fetch-static.mjs
      - name: 提交更新
        run: |
          git config user.name 'news-bot'
          git config user.email 'news-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "自动更新新闻 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
            git push
          fi
